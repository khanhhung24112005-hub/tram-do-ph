<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYDROQUAL · GIÁM SÁT NƯỚC TỪ XA</title>
  <!-- Nhúng file CSS độc lập -->
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <div class="header">
    <div class="logo">HYDROQUAL <span>· GIÁM SÁT TỪ XA</span></div>
    <div class="header-right">
      <div class="status" id="connStatus">ĐANG KẾT NỐI...</div>
      <div id="clock">00:00:00</div>
      <button id="themeToggle" title="Đổi giao diện">☀️</button>
    </div>
  </div>

  <div class="dashboard">
    <div class="card" style="height: 250px;">
      <div class="card-title">💧 ĐỘ pH HIỆN TẠI</div>
      <div id="gaugeChart" style="width: 100%; height: 100%;"></div>
    </div>
    <div class="card voltage-panel" style="height: 250px;">
      <div class="card-title" style="justify-content: space-between;">
        ⚡ ĐIỆN ÁP CẢM BIẾN <span class="dot"></span>
      </div>
      <div>
        <div class="volt-value" id="voltValue">--<span>V</span></div>
        <span class="volt-status">✨ Trực tuyến</span>
      </div>
    </div>
    <div class="card" style="height: 300px; grid-column: 1 / -1;">
      <div class="card-title">📈 BIỂU ĐỒ XU HƯỚNG pH</div>
      <div id="lineChart" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <!-- Nhúng file JS độc lập -->
  <script src="script.js"></script>
</body>
</html>
