<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYDROQUAL · GIÁM SÁT NƯỚC TỪ XA</title>
  <!-- Tải thư viện ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root { --bg-main: #13141b; --bg-card: #1c1f2b; --text-main: #ffffff; --text-dim: #7b849b; --border-line: rgba(255,255,255,0.05); --card-shadow: 0 10px 30px rgba(0,0,0,0.5); --accent-green: #00f2a6; --accent-blue: #00a8ff; --danger: #ff4757; --warning: #ffa502; }
    [data-theme="light"] { --bg-main: #f0f2f5; --bg-card: #ffffff; --text-main: #1a1a2e; --text-dim: #5f6368; --border-line: rgba(0,0,0,0.1); --card-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    body { margin: 0; padding: 20px; background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; transition: background-color 0.3s, color 0.3s; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; color: var(--text-dim); }
    .header-right { display: flex; align-items: center; gap: 15px; }
    .status { color: var(--accent-green); display: flex; align-items: center; gap: 8px; }
    .status::before { content: ''; width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green);}
    #themeToggle { background: transparent; border: 1px solid var(--border-line); color: var(--text-main); border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: 0.3s; }
    #themeToggle:hover { background: rgba(128,128,128,0.1); }
    .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: auto; }
    @media(min-width: 768px) { .dashboard { grid-template-columns: 1fr 1fr; } }
    .card { background: var(--bg-card); border-radius: 16px; padding: 20px; border: 1px solid var(--border-line); box-shadow: var(--card-shadow); display: flex; flex-direction: column; transition: background-color 0.3s, border 0.3s; }
    .card-title { font-size: 0.85rem; color: var(--text-dim); display: flex; align-items: center; gap: 10px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
    .voltage-panel { text-align: center; justify-content: center; position: relative; }
    .volt-value { font-size: 4rem; font-weight: 300; color: var(--accent-green); margin: 20px 0; }
    .volt-value span { font-size: 2rem; color: var(--text-dim); }
    .volt-status { background: rgba(0, 242, 166, 0.1); color: var(--accent-green); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; border: 1px solid rgba(0, 242, 166, 0.3); }
    .reading-text { font-size: 0.85rem; color: var(--accent-blue); letter-spacing: 2px; margin-top: 20px;}
    .slider-group { margin-bottom: 15px; display: flex; align-items: center; gap: 15px; margin-top: 20px;}
    .slider-group label { width: 130px; font-size: 0.85rem; color: var(--text-dim); }
    input[type=range] { flex: 1; accent-color: var(--accent-blue); }
    .val-display { width: 40px; font-weight: bold; }
    .val-danger { color: var(--danger); } .val-warning { color: var(--warning); }
  </style>
</head>
<body>
  <div class="header" style="max-width: 1000px; margin: 0 auto 20px auto;">
    <div style="color: var(--text-main); font-weight: bold;">HYDROQUAL <span style="color: var(--text-dim); font-weight: normal;">· GIÁM SÁT TỪ XA</span></div>
    <div class="header-right">
      <div class="status" id="connStatus">ĐÃ KẾT NỐI CLOUD</div>
      <div id="clock">00:00:00</div>
      <button id="themeToggle" onclick="toggleTheme()" title="Đổi giao diện">☀️</button>
    </div>
  </div>

  <div class="dashboard">
    <!-- Panel 1: Đồng hồ đo pH -->
    <div class="card" style="height: 250px;">
      <div class="card-title">💧 ĐỘ pH HIỆN TẠI (ĐÁM MÂY)</div>
      <div id="gaugeChart" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Panel 2: Điện áp cảm biến -->
    <div class="card voltage-panel" style="height: 250px;">
      <div class="card-title" style="justify-content: space-between;">
        ⚡ ĐIỆN ÁP CẢM BIẾN <span style="width:10px;height:10px;background:var(--accent-green);border-radius:50%;"></span>
      </div>
      <div>
        <div class="volt-value" id="voltValue">--<span>V</span></div>
        <span class="volt-status">✨ Trực tuyến</span>
      </div>
      <div class="reading-text">ĐANG ĐỒNG BỘ DỮ LIỆU</div>
    </div>

    <!-- Panel 3: Biểu đồ xu hướng -->
    <div class="card" style="height: 300px; grid-column: 1 / -1;">
      <div class="card-title">📈 BIỂU ĐỒ XU HƯỚNG pH THỜI GIAN THỰC</div>
      <div id="lineChart" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <script>
    // --- ĐƯỜNG DẪN FIREBASE CỦA EM ---
    const FIREBASE_URL = "https://tramdoph-default-rtdb.asia-southeast1.firebasedatabase.app/sensor.json";

    // --- Quản lý Theme Sáng / Tối ---
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️' : '🌙';

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      document.getElementById('themeToggle').innerText = newTheme === 'dark' ? '☀️' : '🌙';
      updateChartsTheme(newTheme); 
    }

    // Đồng hồ hệ thống
    setInterval(() => {
      let d = new Date();
      document.getElementById('clock').innerText = d.toLocaleTimeString('vi-VN');
    }, 1000);

    // --- Khởi tạo Đồng hồ đo pH (Gauge) ---
    const gaugeChart = echarts.init(document.getElementById('gaugeChart'));
    gaugeChart.setOption({
      series: [{
        type: 'gauge', startAngle: 180, endAngle: 0, min: 0, max: 14, splitNumber: 14,
        axisLine: { lineStyle: { width: 12, color: [[0.3, '#ff4757'], [0.5, '#2ed573'], [0.7, '#1e90ff'], [1, '#9c88ff']] } },
        pointer: { icon: 'path://M12.8,0.7l12,40.1H0.7L12.8,0.7z', length: '12%', width: 15, offsetCenter: [0, '-60%'] },
        axisTick: { length: 8, lineStyle: { width: 1 } },
        splitLine: { length: 15, lineStyle: { width: 2 } },
        axisLabel: { fontSize: 10, distance: -30 },
        title: { offsetCenter: [0, '30%'], fontSize: 12 },
        detail: { fontSize: 40, offsetCenter: [0, '-10%'], valueAnimation: true },
        data: [{ value: 7.0, name: 'ĐANG TẢI DỮ LIỆU...' }]
      }]
    });

    // --- Khởi tạo Biểu đồ đường (Line Chart) ---
    const lineChart = echarts.init(document.getElementById('lineChart'));
    let timeData = []; let phData = [];
    lineChart.setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: '3%', right: '3%', bottom: '5%', top: '5%', containLabel: true },
      xAxis: { type: 'category', boundaryGap: false, data: timeData },
      yAxis: { type: 'value', min: 0, max: 14 },
      series: [{
        name: 'Độ pH', type: 'line', smooth: true, symbol: 'none',
        lineStyle: { width: 3, color: '#00f2a6' },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(0, 242, 166, 0.4)' }, { offset: 1, color: 'rgba(0, 242, 166, 0)' }]) },
        data: phData
      }]
    });

    function updateChartsTheme(theme) {
      const textColor = theme === 'dark' ? '#7b849b' : '#5f6368';
      const splitColor = theme === 'dark' ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.1)';
      const mainTextColor = theme === 'dark' ? '#ffffff' : '#1a1a2e';

      gaugeChart.setOption({
        series: [{
          pointer: { itemStyle: { color: mainTextColor } },
          axisTick: { lineStyle: { color: textColor } },
          splitLine: { lineStyle: { color: textColor } },
          axisLabel: { color: textColor },
          detail: { color: mainTextColor }
        }]
      });
      lineChart.setOption({
        xAxis: { axisLine: { lineStyle: { color: textColor } } },
        yAxis: { splitLine: { lineStyle: { color: splitColor } } }
      });
    }
    updateChartsTheme(savedTheme); 
    window.addEventListener('resize', () => { gaugeChart.resize(); lineChart.resize(); });

    // --- LẤY DỮ LIỆU TỪ FIREBASE MỖI 2 GIÂY ---
    setInterval(() => {
      fetch(FIREBASE_URL)
        .then(res => { if (!res.ok) throw new Error('Lỗi kết nối'); return res.json(); })
        .then(data => {
          if (!data) return;
          document.getElementById('connStatus').style.color = '#00f2a6';
          document.getElementById('connStatus').innerText = 'ĐÃ KẾT NỐI CLOUD';
          
          let ph = parseFloat(data.ph);
          let v = parseFloat(data.v);
          
          document.getElementById('voltValue').innerHTML = v.toFixed(3) + '<span>V</span>';
          
          let statusText = 'TRUNG TÍNH / AN TOÀN';
          let statusColor = '#00f2a6'; 
          if (ph < 6.5) { statusText = 'CẢNH BÁO AXIT'; statusColor = '#ff4757'; }
          else if (ph > 8.5) { statusText = 'CẢNH BÁO KIỀM'; statusColor = '#3742fa'; }
          
          gaugeChart.setOption({
            series: [{ data: [{ value: ph, name: statusText }], title: { color: statusColor } }]
          });

          let now = new Date();
          let t = now.getHours() + ':' + now.getMinutes() + ':' + now.getSeconds();
          if (timeData.length > 25) { timeData.shift(); phData.shift(); }
          timeData.push(t);
          phData.push(ph);
          lineChart.setOption({ xAxis: { data: timeData }, series: [{ data: phData }] });
        })
        .catch(err => {
          document.getElementById('connStatus').style.color = '#ff4757';
          document.getElementById('connStatus').innerText = 'MẤT KẾT NỐI CLOUD';
        });
    }, 2000);
  </script>
</body>
</html>
